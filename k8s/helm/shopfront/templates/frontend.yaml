apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: {{ .Values.frontend.replicas | default 1 }}
  strategy:
    canary:
      {{- if and .Values.istio .Values.istio.enabled }}
      stableService: frontend
      canaryService: frontend-canary
      trafficRouting:
        istio:
          virtualService:
            name: frontend
            routes:
              - primary
      {{- end }}
      steps:
        - setWeight: 25
        - pause: {}
        - setWeight: 50
        - pause: { duration: 30s }
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.registry }}/shopfront-frontend:{{ .Values.frontend.imageTag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: {{ .Values.frontend.memory | default "64Mi" }}
            limits:
              memory: {{ .Values.frontend.memory | default "64Mi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: {{ .Values.frontend.serviceType }}
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80

{{- if and .Values.istio .Values.istio.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-canary
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend
spec:
  hosts:
    - frontend
  http:
    - name: primary
      route:
        - destination:
            host: frontend
          weight: 100
        - destination:
            host: frontend-canary
          weight: 0
{{- end }}
