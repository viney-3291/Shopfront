{{- if and .Values.externalSecrets .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shopfront-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: shopfront-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: shopfront/app
        property: jwt-secret
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: shopfront-secrets
type: Opaque
stringData:
  jwt-secret: {{ .Values.jwtSecret | quote }}
{{- end }}