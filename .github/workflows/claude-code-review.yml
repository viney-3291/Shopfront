   name: AI Code Review
   
   on:
     pull_request:
       types: [opened, synchronize, ready_for_review, reopened]
   
   jobs:
     ai-review:
       runs-on: ubuntu-latest
       
       permissions:
         contents: read
         pull-requests: write
         id-token: write
       
       steps:
         - uses: actions/checkout@v3
           with:
             fetch-depth: 0

         - uses: anthropics/claude-code-action@v1
           with:
             anthropic_federation_rule_id: ${{ secrets.ANTHROPIC_FED_RULE_ID }}  
             anthropic_organization_id: ${{ secrets.ANTHROPIC_ORG_ID }}
             anthropic_service_account_id: ${{ secrets.ANTHROPIC_SVC_ACCOUNT_ID }}
             anthropic_workspace_id: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
             plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
             plugins: "code-review@claude-code-plugins"
             prompt: |
               /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}