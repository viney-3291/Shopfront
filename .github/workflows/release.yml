name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - cart-service
          - email-service
          - frontend
          - inventory-service
          - notification-service
          - order-service
          - payment-service
          - product-service
          - recommendation-service
          - review-service
          - search-service
          - shipping-service
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build context
        id: ctx
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "path=./frontend" >> "$GITHUB_OUTPUT"
          else
            echo "path=./services/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.path }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shopfront-${{ matrix.service }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/shopfront-${{ matrix.service }}:stable