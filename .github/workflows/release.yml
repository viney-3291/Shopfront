name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 865749917919.dkr.ecr.us-east-1.amazonaws.com
  AWS_ROLE_ARN: arn:aws:iam::865749917919:role/shopfront-github-actions

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - cart-service
          - email-service
          - frontend
          - inventory-service
          - notification-service
          - order-service
          - payment-service
          - product-service
          - recommendation-service
          - review-service
          - search-service
          - shipping-service
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build context
        id: ctx
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "path=./frontend" >> "$GITHUB_OUTPUT"
          else
            echo "path=./services/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.path }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/shopfront-${{ matrix.service }}:${{ steps.version.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/shopfront-${{ matrix.service }}:stable